name: Build HID Module
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone kernel source (shallow)
        run: |
          git clone --depth=1 --branch master https://github.com/GiovanYCringe-Experiments/kernel_a50.git
          cd kernel_a50
          
      - name: Setup compiler
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
          
      - name: Configure and build HID module
        run: |
          cd kernel_a50
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a50_defconfig
          echo "CONFIG_USB_CONFIGFS_F_HID=m" >> .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/usb/gadget/function
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hid-module
          path: kernel_a50/drivers/usb/gadget/function/*.ko