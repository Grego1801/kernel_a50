name: Build HID Gadget Module for A50
on:
  workflow_dispatch:  # You manually trigger this

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: GiovanYCringe-Experiments/kernel_a50
          ref: master
          
      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu make bc bison flex libssl-dev
          
      - name: Configure kernel with HID gadget
        run: |
          # Use the existing A50 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a50_defconfig
          # Enable HID gadget (THIS IS THE MAGIC LINE)
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> .config
          # Also make sure it's built as a module (not built-in)
          echo "CONFIG_USB_CONFIGFS_F_HID=m" >> .config
          
      - name: Build only the HID module
        run: |
          # Prepare kernel headers
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare
          # Build just the USB gadget HID module
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/usb/gadget/function
          
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: hid-gadget-a50
          path: |
            drivers/usb/gadget/function/usb_f_hid.ko
            drivers/usb/gadget/function/g_hid.ko
            Module.symvers