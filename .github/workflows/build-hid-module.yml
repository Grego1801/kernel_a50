name: Build HIDP Kernel Module
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel
      run: |
        git clone --depth=1 https://github.com/GiovanYCringe-Experiments/kernel_a50.git

    - name: Install toolchain
      run: |
        sudo apt update
        sudo apt install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev gcc binutils

    - name: Build HIDP module
      run: |
        cd kernel_a50
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        make a50_defconfig
        echo "CONFIG_BT_HIDP=m" >> .config
        make olddefconfig
        make modules_prepare
        make M=net/bluetooth/hidp modules

    - name: Upload module
      uses: actions/upload-artifact@v4
      with:
        name: hidp-module
        path: kernel_a50/net/bluetooth/hidp/hidp.ko